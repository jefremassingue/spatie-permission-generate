name: Update Packagist

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  packagist:
    name: Notify Packagist
    runs-on: ubuntu-latest

    steps:
      - name: Update package on Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_API_TOKEN" ]; then
            echo "PACKAGIST_USERNAME and/or PACKAGIST_API_TOKEN are not configured. Skipping."
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_API_TOKEN}" \
            -d '{"repository":"https://github.com/jefremassingue/spatie-permission-generate"}'
